user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;

  # The JS bundle and CSS are the bulk of a first page load and compress ~4x; text-like assets
  # only (images, fonts and the like are already compressed). nginx always includes text/html.
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types      text/plain text/css text/javascript application/javascript application/json
                  application/manifest+json image/svg+xml;

  keepalive_timeout  65;

  server {
      listen 80;
      # Lets the Google sign-in popup (see src/features/auth/LoginPage.tsx) keep a reference to
      # this window so it can postMessage the credential back on success - see vite.config.ts for
      # the matching header on the dev server.
      add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

      # config.js is rewritten per-container by set-env.sh at start (see its own comment) - it
      # must never be cached by the browser or an intermediate proxy/CDN (e.g. Cloudflare, which
      # caches .js by extension even with no origin cache-control), or a redeploy with new
      # API_URI/GOOGLE_OAUTH_CLIENT_ID values can silently keep serving stale ones indefinitely.
      location = /config.js {
        root    /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
      }

      # nginx's stock mime.types has no .webmanifest entry, so it would otherwise fall back to
      # the http block's application/octet-stream default - some browsers refuse to treat a
      # manifest served with that content-type as installable at all.
      # no-transform: Android builds the installed app (a WebAPK) on Google's servers, which fetch
      # this manifest and its icons again and check they match what the phone saw. A CDN that
      # rewrites them (Cloudflare's image optimization, minification) makes that check fail and
      # the install spins and gives up - see the icons location below.
      location = /manifest.webmanifest {
        root    /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-transform" always;
      }

      # App icons, also fetched by the WebAPK server (see the manifest above): never rewritten by a
      # CDN, and revalidated so a redesigned icon reaches installed apps.
      location /icons/ {
        root    /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, no-transform";
      }

      # The service worker and the page shell must be revalidated on every load, or a deploy keeps
      # running the previous build: Cloudflare caches .js by extension (see config.js above), and a
      # page held in a cache points at hashed assets that the new image no longer has. no-cache still
      # lets the browser reuse its copy after a cheap 304. The page repeats the COOP header because
      # an add_header here replaces, rather than adds to, the server-level ones.
      location = /sw.js {
        root    /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
      }

      location = /index.html {
        root    /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "no-cache" always;
      }

      # Vite's build output: every file name carries a content hash, so a file never changes and can
      # be cached for good. A missing one (a chunk from a previous deploy) is a real 404 - falling
      # back to index.html like the routes below would hand the browser HTML as JavaScript, which a
      # CDN would then cache under the chunk's URL (the app reloads itself on that 404, see
      # src/recoverFromStaleDeploy.ts).
      location /assets/ {
        root    /usr/share/nginx/html;
        try_files $uri =404;
        # No `always`: only successful responses are cached for good, never the 404.
        add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }
  }
}
