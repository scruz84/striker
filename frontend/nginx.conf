user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;

  keepalive_timeout  65;

  server {
      listen 80;
      # Lets the Google sign-in popup (see src/features/auth/LoginPage.tsx) keep a reference to
      # this window so it can postMessage the credential back on success - see vite.config.ts for
      # the matching header on the dev server.
      add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

      # config.js is rewritten per-container by set-env.sh at start (see its own comment) - it
      # must never be cached by the browser or an intermediate proxy/CDN (e.g. Cloudflare, which
      # caches .js by extension even with no origin cache-control), or a redeploy with new
      # API_URI/GOOGLE_OAUTH_CLIENT_ID values can silently keep serving stale ones indefinitely.
      location = /config.js {
        root    /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
      }

      # nginx's stock mime.types has no .webmanifest entry, so it would otherwise fall back to
      # the http block's application/octet-stream default - some browsers refuse to treat a
      # manifest served with that content-type as installable at all.
      location = /manifest.webmanifest {
        root    /usr/share/nginx/html;
        default_type application/manifest+json;
      }

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }
  }
}
