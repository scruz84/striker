name: striker-backend

networks:
  striker-net:
    driver: bridge

services:
  svc:
    build:
      context: .
      dockerfile: resources/Dockerfile
    command: ["--svc"]
    restart: unless-stopped
    environment: &backend-env
      DB_HOST: ${DB_HOST:-psql}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-striker}
      DB_USER: ${DB_USER:-striker}
      DB_PASSWORD: ${DB_PASSWORD:-striker}
      REDIS_HOST: ${REDIS_HOST-redis}
      REDIS_PORT: ${REDIS_PORT-6379}
      #REDIS_PASSWORD: ""
      REDIS_DB: ${REDIS_DB:-0}
      SECRET_JWT: ${SECRET_JWT:-dev-only-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      REALM: ${REALM:-Striker Manager}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-24h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # OpenTelemetry metrics export - off by default, see backend/README.md's "OpenTelemetry
      # metrics" section. OTEL_EXPORTER_OTLP_ENDPOINT and the rest of the standard OTLP env vars
      # pass through as-is when set, no explicit default needed here.
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${SVC_PORT:-1984}:1984"
    networks:
      - striker-net

  engine:
    build:
      context: .
      dockerfile: resources/Dockerfile
    command: ["--engine"]
    restart: unless-stopped
    environment: *backend-env


  # One-off, destructive DB seed/reset job. Wipes and recreates all game data (countries,
  # leagues, teams, players, season), so it's excluded from a plain `docker compose up`.
  # Run explicitly and deliberately with:
  #   docker compose --profile init run --rm init
  init:
    build:
      context: .
      dockerfile: resources/Dockerfile
    command: ["--initialize"]
    profiles: ["init"]
    environment: *backend-env
