name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running Striker?
      options:
        - Docker Compose (quick start)
        - Docker Compose (external Postgres/Redis)
        - Local dev (go run / npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: relevant-config
    attributes:
      label: Relevant configuration
      description: Any non-default env vars involved (e.g. ADMIN_EMAILS, DEV_LOGIN_ENABLED) - omit secrets/passwords.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Backend/engine logs (`docker compose logs svc engine`), browser console output, or screenshots.
      render: shell
    validations:
      required: false
