name: Docker images

# Publishes the backend and frontend images to the GitHub Container Registry:
#   ghcr.io/<owner>/striker-backend   (one image: svc, engine and init are its three commands)
#   ghcr.io/<owner>/striker-frontend
# for linux/amd64 and linux/arm64, tagged sha-<short commit> and, for main, latest.
#
# Runs after the CI workflow finishes green on a push to main (so an image is never published
# for a commit with failing checks), and on demand from the Actions tab ("Run workflow"). A manual
# run on another branch only publishes its sha-<commit> tag, never latest.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Publishing overlapping runs one at a time keeps `latest` on the newest commit.
concurrency:
  group: docker-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: striker-backend
            context: backend
            dockerfile: backend/resources/Dockerfile
          - image: striker-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Resolve the commit and tags
        id: meta
        env:
          # A workflow_run event builds the exact commit CI checked, not whatever main points to now.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          tags="${image}:sha-${SHA::7}"
          if [ "$BRANCH" = "main" ]; then tags="${tags},${image}:latest"; fi
          {
            echo "sha=${SHA}"
            echo "tags=${tags}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      # Emulation is only needed for the few RUN steps of the arm64 runtime stage; the Go and npm
      # builds run natively and cross-compile (see the Dockerfiles).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
